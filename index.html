<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>VR Studio — Final Release</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bangers&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; background-color: #050508; color: #f8fafc; -webkit-font-smoothing: antialiased; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
  .glass { background: rgba(18, 18, 22, 0.85); backdrop-filter: blur(20px); border-top: 1px solid rgba(255, 255, 255, 0.08); }
  .neon-text { background: linear-gradient(135deg, #a78bfa, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .neon-btn { background: linear-gradient(135deg, #8b5cf6, #3b82f6); box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3); transition: all 0.15s; color: white; }
  .neon-btn:active { transform: scale(0.97); opacity: 0.9; }
  .timeline-track { position: relative; height: 60px; background: #121215; border-radius: 8px; overflow: hidden; border: 1px solid #27272a; cursor: pointer; }
  .cut-zone { position: absolute; height: 100%; background: repeating-linear-gradient(45deg, rgba(239, 68, 68, 0.4), rgba(239, 68, 68, 0.4) 10px, rgba(239, 68, 68, 0.2) 10px, rgba(239, 68, 68, 0.2) 20px); border-right: 1px solid #ef4444; }
  .text-zone { position: absolute; top: 0; height: 15px; background: #8b5cf6; border-radius: 3px; opacity: 0.8; }
  .playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; z-index: 10; box-shadow: 0 0 8px rgba(255,255,255,0.8); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const formatTime = (s) => {
  if (!s || isNaN(s)) return "0:00";
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, '0')}`;
};

function App() {
  // Video State
  const [videoUrl, setVideoUrl] = useState('');
  const [duration, setDuration] = useState(0);
  const [currentTime, setCurrentTime] = useState(0);
  const [isPlaying, setIsPlaying] = useState(false);
  const [ratio, setRatio] = useState('9:16');
  
  // UI State
  const [activeTab, setActiveTab] = useState('cut');
  const [isExporting, setIsExporting] = useState(false);
  const [exportProgress, setExportProgress] = useState(0);
  
  // EDL State & History
  const [edl, setEdl] = useState({ cuts: [], texts: [], zooms: [] });
  const [history, setHistory] = useState([{ cuts: [], texts: [], zooms: [] }]);
  const [historyIndex, setHistoryIndex] = useState(0);

  // AI State
  const [geminiKey, setGeminiKey] = useState(localStorage.getItem('vr_studio_key') || '');
  const [aiPrompt, setAiPrompt] = useState('');
  const [isAiThinking, setIsAiThinking] = useState(false);

  // Refs
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const audioCtxRef = useRef(null);
  const audioSourceRef = useRef(null); // CRITICAL FIX: Persistent audio source
  const requestRef = useRef(null);
  const blobUrlRef = useRef('');

  // --- AUDIO INIT ---
  useEffect(() => {
    if (!audioCtxRef.current) {
      audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
    }
    return () => {
      if (audioCtxRef.current) audioCtxRef.current.close();
    };
  }, []);

  // --- FILE HANDLING ---
  const handleFileUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;

    // Revoke old URL to prevent memory leaks
    if (blobUrlRef.current) URL.revokeObjectURL(blobUrlRef.current);
    
    const url = URL.createObjectURL(file);
    blobUrlRef.current = url;
    setVideoUrl(url);
    
    const initialEdl = { cuts: [], texts: [], zooms: [] };
    setEdl(initialEdl);
    setHistory([initialEdl]);
    setHistoryIndex(0);
    
    // Reset audio source
    if (audioSourceRef.current) {
      audioSourceRef.current.disconnect();
      audioSourceRef.current = null;
    }
  };

  // --- HISTORY ---
  const saveState = (newEdl) => {
    const newHistory = history.slice(0, historyIndex + 1);
    newHistory.push(newEdl);
    setHistory(newHistory);
    setHistoryIndex(newHistory.length - 1);
    setEdl(newEdl);
  };

  const undo = () => {
    if (historyIndex > 0) {
      setHistoryIndex(historyIndex - 1);
      setEdl(history[historyIndex - 1]);
    }
  };

  const redo = () => {
    if (historyIndex < history.length - 1) {
      setHistoryIndex(historyIndex + 1);
      setEdl(history[historyIndex + 1]);
    }
  };

  // --- RENDER LOOP (ALWAYS RUNNING) ---
  const drawFrame = () => {
    const video = videoRef.current;
    const canvas = canvasRef.current;
    
    if (video && canvas && video.readyState >= 2) {
      const ctx = canvas.getContext('2d');
      const time = video.currentTime;

      // 1. Handle Cuts (Skip)
      const activeCut = edl.cuts.find(c => time >= c.start && time <= c.end);
      if (activeCut && !video.paused) {
        if (video.fastSeek) video.fastSeek(activeCut.end);
        else video.currentTime = activeCut.end;
      }

      // 2. Clear Canvas
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 3. Zoom Effect
      let scale = 1.0;
      const activeZoom = edl.zooms.find(z => time >= z.time && time <= z.time + 2);
      if (activeZoom) {
        const progress = (time - activeZoom.time) / 2;
        scale = activeZoom.intensity - (progress * 0.2); 
      }
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.scale(scale, scale);

      // 4. Draw Video (Fit)
      const vRatio = video.videoWidth / video.videoHeight;
      const cRatio = canvas.width / canvas.height;
      let w = canvas.width, h = canvas.height;
      if (vRatio > cRatio) h = canvas.width / vRatio; else w = canvas.height * vRatio;
      ctx.drawImage(video, -w/2, -h/2, w, h);

      // 5. Draw Text
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      edl.texts.forEach(t => {
        if (time >= t.start && time <= t.end) {
          ctx.font = `900 ${ratio === '9:16' ? '60px' : '70px'} ${t.font || 'Montserrat'}`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          
          const opacity = Math.min(1, (time - t.start) * 5);
          ctx.globalAlpha = opacity;

          ctx.lineWidth = 10;
          ctx.strokeStyle = '#000';
          ctx.lineJoin = 'round';
          ctx.strokeText(t.content, canvas.width / 2, canvas.height * 0.75);
          
          ctx.fillStyle = t.color || '#fff';
          ctx.fillText(t.content, canvas.width / 2, canvas.height * 0.75);
          ctx.globalAlpha = 1;
        }
      });

      setCurrentTime(time);
    }
    requestRef.current = requestAnimationFrame(drawFrame);
  };

  // Start loop on mount
  useEffect(() => {
    requestRef.current = requestAnimationFrame(drawFrame);
    return () => cancelAnimationFrame(requestRef.current);
  }, [edl, ratio]); // Rebind loop when EDL changes

  const togglePlay = () => {
    const video = videoRef.current;
    if (!video) return;
    
    if (video.paused) {
      video.play();
      setIsPlaying(true);
    } else {
      video.pause();
      setIsPlaying(false);
    }
  };

  // --- AUTO CUT ---
  const autoCutSilence = async () => {
    if (!videoRef.current) return;
    const video = videoRef.current;
    const audioCtx = audioCtxRef.current;
    
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    
    // CRITICAL FIX: Only create source once
    if (!audioSourceRef.current) {
      audioSourceRef.current = audioCtx.createMediaElementSource(video);
    }
    
    const analyser = audioCtx.createAnalyser();
    audioSourceRef.current.connect(analyser);
    // Do not connect to destination, we don't want to hear it during analysis
    
    const dataArray = new Uint8Array(analyser.frequencyBinCount);
    let frames = [];
    
    video.muted = true;
    video.currentTime = 0;
    video.play();

    const analyze = () => {
      if (video.paused || video.ended) {
        video.pause(); video.muted = false;
        analyser.disconnect(); // Cleanup
        
        let cuts = [];
        let isSilent = false, silenceStart = 0;
        const threshold = 10; // Sensitivity

        frames.forEach(f => {
          if (f.vol < threshold && !isSilent) { isSilent = true; silenceStart = f.time; }
          else if (f.vol >= threshold && isSilent) {
            isSilent = false;
            if (f.time - silenceStart > 1.5) cuts.push({ start: silenceStart, end: f.time });
          }
        });

        saveState({ ...edl, cuts: [...edl.cuts, ...cuts] });
        return;
      }

      analyser.getByteFrequencyData(dataArray);
      let sum = 0; for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
      frames.push({ time: video.currentTime, vol: sum / dataArray.length });
      
      requestAnimationFrame(analyze);
    };
    analyze();
  };

  // --- AI DIRECTOR ---
  const processAI = async () => {
    if (!geminiKey || !aiPrompt) return alert("Enter prompt and API key.");
    setIsAiThinking(true);
    try {
      const prompt = `You are a video editing AI. Translate the user's command into an array of JSON actions.
      Actions: Cut {"type": "cut", "start": num, "end": num}, Text {"type": "text", "start": num, "end": num, "content": "str", "color": "#fff", "font": "Bangers"}, Zoom {"type": "zoom", "time": num, "intensity": num}.
      User: "${aiPrompt}"
      Return ONLY JSON array.`;
      
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiKey}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
      });
      
      const data = await res.json();
      let text = data.candidates[0].content.parts[0].text;
      
      const jsonMatch = text.match(/\[[\s\S]*\]/);
      if (!jsonMatch) throw new Error("No JSON found");
      
      const actions = JSON.parse(jsonMatch[0]);
      let newEdl = { ...edl };
      actions.forEach(a => {
        if (a.type === 'cut') newEdl.cuts.push({ start: a.start, end: a.end });
        if (a.type === 'text') newEdl.texts.push({ start: a.start, end: a.end, content: a.content, color: a.color, font: a.font });
        if (a.type === 'zoom') newEdl.zooms.push({ time: a.time, intensity: a.intensity });
      });
      
      saveState(newEdl);
      setAiPrompt('');
    } catch (e) {
      alert("AI Error: " + e.message);
    } finally {
      setIsAiThinking(false);
    }
  };

  // --- EXPORT ENGINE ---
  const exportVideo = async () => {
    const video = videoRef.current;
    const canvas = canvasRef.current;
    const audioCtx = audioCtxRef.current;
    
    if (!video || !canvas) return;
    
    setIsExporting(true);
    setExportProgress(0);
    video.pause();
    setIsPlaying(false);
    
    // Ensure audio is routed to destination for export
    if (!audioSourceRef.current) {
      audioSourceRef.current = audioCtx.createMediaElementSource(video);
    }
    const dest = audioCtx.createMediaStreamDestination();
    audioSourceRef.current.connect(dest);
    // Don't connect to speakers during export to avoid echo
    
    const stream = canvas.captureStream(30);
    dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
    
    const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9,opus' });
    let chunks = [];
    
    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const a = document.createElement('a'); 
      a.href = URL.createObjectURL(blob); 
      a.download = 'VR_Export.webm'; 
      a.click();
      
      // Cleanup
      audioSourceRef.current.disconnect(dest);
      setIsExporting(false);
    };
    
    video.currentTime = 0;
    video.play();
    recorder.start();
    
    const checkExport = () => {
      if (video.ended || !isExporting) { 
        recorder.stop(); 
        return; 
      }
      setExportProgress((video.currentTime / duration) * 100);
      requestAnimationFrame(checkExport);
    };
    checkExport();
  };

  useEffect(() => {
    if (canvasRef.current) {
      canvasRef.current.width = ratio === '9:16' ? 720 : 1280;
      canvasRef.current.height = ratio === '9:16' ? 1280 : 720;
    }
  }, [ratio]);

  return (
    <div className="flex flex-col h-screen bg-[#050508] text-white">
      
      {/* Top Bar */}
      <header className="flex justify-between items-center px-4 py-2 border-b border-gray-800 z-50 bg-[#09090b]">
        <h1 className="text-sm font-bold tracking-wider">VR STUDIO <span className="neon-text">PRO</span></h1>
        <div className="flex gap-2">
          <button onClick={undo} disabled={historyIndex === 0} className="px-2 py-1 bg-gray-800 text-xs rounded disabled:opacity-50">Undo</button>
          <button onClick={redo} disabled={historyIndex === history.length - 1} className="px-2 py-1 bg-gray-800 text-xs rounded disabled:opacity-50">Redo</button>
          {!videoUrl ? (
            <label className="neon-btn px-3 py-1 rounded text-xs font-bold cursor-pointer">Import<input type="file" accept="video/*" className="hidden" onChange={handleFileUpload} /></label>
          ) : (
            <button onClick={exportVideo} disabled={isExporting} className="neon-btn px-3 py-1 rounded text-xs font-bold">
              {isExporting ? `${Math.round(exportProgress)}%` : 'Export'}
            </button>
          )}
        </div>
      </header>

      {/* Main Canvas */}
      <main className="flex-1 relative flex items-center justify-center bg-black overflow-hidden">
        {!videoUrl ? (
          <div className="text-center space-y-2">
            <p className="text-gray-400">No video loaded</p>
            <label className="neon-btn px-6 py-2 rounded-xl cursor-pointer inline-block">Select File<input type="file" accept="video/*" className="hidden" onChange={handleFileUpload} /></label>
          </div>
        ) : (
          <div className={`relative ${ratio === '9:16' ? 'h-full aspect-[9/16]' : 'w-full aspect-video'} max-h-full max-w-full flex items-center justify-center`}>
            <video ref={videoRef} src={videoUrl} onLoadedMetadata={(e) => setDuration(e.target.duration)} className="hidden" playsInline crossOrigin="anonymous" />
            <canvas ref={canvasRef} className="w-full h-full object-contain cursor-pointer" onClick={togglePlay} />
            
            {!isPlaying && !isExporting && (
              <div onClick={togglePlay} className="absolute inset-0 flex items-center justify-center bg-black/40">
                <div className="w-16 h-16 bg-white/20 backdrop-blur rounded-full flex items-center justify-center text-2xl">▶</div>
              </div>
            )}
            
            <div className="absolute top-2 right-2 flex gap-2">
              <button onClick={() => setRatio(ratio === '9:16' ? '16:9' : '9:16')} className="bg-black/60 px-3 py-1 text-xs rounded border border-gray-600 backdrop-blur">
                {ratio === '9:16' ? '📱 Shorts' : '💻 Long'}
              </button>
            </div>
          </div>
        )}
      </main>

      {/* Timeline */}
      {videoUrl && (
        <div className="h-20 bg-[#121215] border-t border-gray-800 p-2 flex flex-col justify-center">
          <div className="flex justify-between text-xs font-mono text-gray-400 mb-1 px-1">
            <span>{formatTime(currentTime)}</span>
            <span>{formatTime(duration)}</span>
          </div>
          <div className="timeline-track" onClick={(e) => {
            const rect = e.currentTarget.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            videoRef.current.currentTime = pct * duration;
          }}>
            {edl.cuts.map((c, i) => (
              <div key={i} className="cut-zone" style={{ left: `${(c.start/duration)*100}%`, width: `${((c.end-c.start)/duration)*100}%` }} />
            ))}
            {edl.texts.map((t, i) => (
              <div key={`t-${i}`} className="text-zone" style={{ left: `${(t.start/duration)*100}%`, width: `${((t.end-t.start)/duration)*100}%` }} />
            ))}
            <div className="playhead" style={{ left: `${(currentTime/duration)*100}%` }} />
          </div>
        </div>
      )}

      {/* Bottom Toolbar */}
      {videoUrl && (
        <div className="h-64 glass z-50 flex flex-col">
          <div className="flex-1 overflow-y-auto p-4">
            {activeTab === 'cut' && (
              <div className="space-y-4">
                <h3 className="text-xs font-bold text-gray-400 uppercase">Smart Cut</h3>
                <button onClick={autoCutSilence} className="w-full bg-gray-800 py-3 rounded-lg font-bold">Auto-Cut Silence</button>
                <p className="text-xs text-gray-500">Automatically finds quiet sections and skips them during playback and export.</p>
              </div>
            )}
            
            {activeTab === 'text' && (
              <div className="space-y-4">
                <h3 className="text-xs font-bold text-gray-400 uppercase">Add Text</h3>
                <div className="flex gap-2">
                  <input type="text" id="txtInput" placeholder="Text..." className="flex-1 bg-gray-900 rounded p-2 text-sm border border-gray-700" />
                  <button onClick={() => {
                    const val = document.getElementById('txtInput').value;
                    if(val) saveState({ ...edl, texts: [...edl.texts, { start: currentTime, end: currentTime + 3, content: val, color: '#fff', font: 'Bangers' }] });
                  }} className="neon-btn px-4 rounded text-sm">Add</button>
                </div>
              </div>
            )}

            {activeTab === 'ai' && (
              <div className="space-y-4">
                <h3 className="text-xs font-bold text-purple-400 uppercase">AI Director</h3>
                <input type="password" value={geminiKey} onChange={e => {setGeminiKey(e.target.value); localStorage.setItem('vr_studio_key', e.target.value);}} placeholder="Gemini API Key" className="w-full bg-gray-900 p-2 text-xs rounded border border-gray-700" />
                <div className="flex gap-2">
                  <input type="text" value={aiPrompt} onChange={e => setAiPrompt(e.target.value)} placeholder="e.g. Cut 5s to 10s, add text EPIC" className="flex-1 bg-gray-900 rounded p-2 text-sm border border-gray-700" />
                  <button onClick={processAI} className="neon-btn px-4 rounded text-sm">{isAiThinking ? '...' : 'Run'}</button>
                </div>
              </div>
            )}
          </div>

          <div className="flex justify-around items-center border-t border-gray-800 py-2 px-2">
            {['cut', 'text', 'ai'].map(t => (
              <button key={t} onClick={() => setActiveTab(t)} className={`flex flex-col items-center text-[10px] font-bold uppercase ${activeTab === t ? 'text-purple-400' : 'text-gray-500'}`}>
                <div className={`w-8 h-8 rounded-lg flex items-center justify-center mb-1 ${activeTab === t ? 'bg-purple-500/20' : ''}`}>
                  {t === 'cut' ? '✂️' : t === 'text' ? 'T' : '🧠'}
                </div>
                {t}
              </button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>

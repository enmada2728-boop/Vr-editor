<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050508">
<title>VR Editor AI — Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Bangers&family=Montserrat:wght@900&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; background-color: #050508; color: #f8fafc; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  .glass { background: rgba(20, 20, 28, 0.7); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.08); }
  .neon-text { background: linear-gradient(135deg, #8b5cf6, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .neon-btn { background: linear-gradient(135deg, #8b5cf6, #3b82f6); box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3); transition: all 0.15s; }
  .neon-btn:active { transform: scale(0.97); opacity: 0.9; }
  .timeline-track { background: #121215; border: 1px solid #27272a; position: relative; height: 60px; border-radius: 8px; overflow: hidden; }
  .timeline-highlight { background: rgba(139, 92, 246, 0.4); border: 1px solid #8b5cf6; position: absolute; top: 0; bottom: 0; }
</style>
</head>
<body>
<div id="root"></div>
<canvas id="motionCanvas" width="64" height="64" class="hidden"></canvas>
<canvas id="renderCanvas" class="hidden"></canvas>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

function App() {
  const [activeTab, setActiveTab] = useState('dashboard');
  const [videoFile, setVideoFile] = useState(null);
  const [videoUrl, setVideoUrl] = useState('');
  const [videoDuration, setVideoDuration] = useState(0);
  const [isAnalyzing, setIsAnalyzing] = useState(false);
  const [analyzeProgress, setAnalyzeProgress] = useState(0);
  const [highlights, setHighlights] = useState([]);
  
  // Settings State
  const [ratio, setRatio] = useState('9:16');
  const [intensity, setIntensity] = useState('medium');
  const [style, setStyle] = useState('gaming');
  const [font, setFont] = useState('Montserrat');
  const [captionColor, setCaptionColor] = useState('#8b5cf6');
  
  // API Keys & AI Research State
  const [geminiKey, setGeminiKey] = useState(localStorage.getItem('vr_editor_gemini') || '');
  const [ytKey, setYtKey] = useState(localStorage.getItem('vr_editor_yt') || '');
  const [transcriptKey, setTranscriptKey] = useState(localStorage.getItem('vr_editor_transcript') || '');
  
  const [gameName, setGameName] = useState('');
  const [isResearching, setIsResearching] = useState(false);
  const [customCaptions, setCustomCaptions] = useState(["EPIC MOMENT", "NO WAY", "CLUTCH"]);
  
  // Render State
  const [isRendering, setIsRendering] = useState(false);
  const [renderProgress, setRenderProgress] = useState(0);

  const videoRef = useRef(null);
  const audioCtxRef = useRef(null);
  const mediaRecorderRef = useRef(null);
  const chunksRef = useRef([]);

  const saveSettings = () => {
    localStorage.setItem('vr_editor_gemini', geminiKey);
    localStorage.setItem('vr_editor_yt', ytKey);
    localStorage.setItem('vr_editor_transcript', transcriptKey);
    alert("All API Keys saved!");
  };

  const handleFileUpload = (e) => {
    const file = e.target.files[0];
    if (file) {
      setVideoFile(file);
      setVideoUrl(URL.createObjectURL(file));
      setHighlights([]);
      setAnalyzeProgress(0);
      setActiveTab('analyze');
    }
  };

  const handleVideoLoaded = () => {
    if (videoRef.current) setVideoDuration(videoRef.current.duration);
  };

  // --- REAL GAME INTEL RESEARCH AGENT (With YouTube & Transcripts) ---
  const researchGameStyle = async () => {
    if (!geminiKey || !ytKey || !transcriptKey) { 
      alert("Please add all 3 API keys in Settings first."); 
      return; 
    }
    if (!gameName) { alert("Please enter the game name."); return; }
    
    setIsResearching(true);
    let videoData = "";

    try {
      // Step 1: Search YouTube for the game's top recent Shorts
      const searchUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(gameName + ' VR shorts')}&type=video&order=viewCount&maxResults=3&key=${ytKey}`;
      const searchRes = await fetch(searchUrl);
      const searchData = await searchRes.json();
      
      if (searchData.items && searchData.items.length > 0) {
        for (const item of searchData.items) {
          const vid = item.id.videoId;
          const title = item.snippet.title;
          
          // Step 2: Fetch transcript for each video
          let transcriptText = "Transcript unavailable.";
          try {
            const trRes = await fetch(`https://youtube-transcript.ai/transcript/${vid}.txt?key=${transcriptKey}`);
            if (trRes.ok) {
              transcriptText = await trRes.text();
              // Truncate to save tokens (first 1500 chars)
              transcriptText = transcriptText.substring(0, 1500);
            }
          } catch (e) { /* Ignore transcript errors */ }
          
          videoData += `VIDEO: "${title}"\nTRANSCRIPT: "${transcriptText}"\n\n`;
        }
      } else {
        videoData = "No recent YouTube videos found for this game. Rely on general viral knowledge.";
      }

      // Step 3: Send real data to Gemini
      const prompt = `You are a viral YouTube Shorts editor. I am editing gameplay from "${gameName}".
      Here is the REAL data from the currently most popular videos for this game:
      ${videoData}
      
      Based on what these creators are actually saying and doing in their viral videos, what editing style should I use?
      Respond ONLY with a valid JSON object (no markdown, no backticks) matching this structure:
      {
        "font": "Bangers" or "Montserrat" or "Inter",
        "color": "A hex color code like #ff0000 or #ffff00",
        "intensity": "low" or "medium" or "extreme",
        "captions": ["3 viral funny/exciting words extracted from their style to use as pop-up text"]
      }`;

      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
      });
      
      const data = await res.json();
      let text = data.candidates[0].content.parts[0].text;
      text = text.replace(/```json/g, '').replace(/```/g, '').trim();
      
      const result = JSON.parse(text);
      
      setFont(result.font);
      setCaptionColor(result.color);
      setIntensity(result.intensity);
      setCustomCaptions(result.captions);
      
      alert(`Research Complete! I analysed the top videos for ${gameName} and applied the viral style.`);
    } catch (err) {
      console.error(err);
      alert("Failed to research. Your API keys might be wrong or limits reached.");
    } finally {
      setIsResearching(false);
    }
  };

  const startAnalysis = async () => {
    if (!videoRef.current) return;
    setIsAnalyzing(true);
    setHighlights([]);
    
    const video = videoRef.current;
    video.muted = false;
    video.currentTime = 0;
    
    if (!audioCtxRef.current) audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
    const audioCtx = audioCtxRef.current;
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    
    const source = audioCtx.createMediaElementSource(video);
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);
    
    const dataArray = new Uint8Array(analyser.frequencyBinCount);
    const detectedHighlights = [];
    
    const mCanvas = document.getElementById('motionCanvas');
    const mCtx = mCanvas.getContext('2d', { willReadFrequently: true });
    let prevFrameData = null;

    video.play();

    const analyzeLoop = () => {
      if (video.paused || video.ended) {
        setIsAnalyzing(false);
        setAnalyzeProgress(100);
        source.disconnect();
        
        const merged = [];
        detectedHighlights.sort((a, b) => a.time - b.time).forEach(h => {
          if (merged.length === 0) merged.push(h);
          else {
            const last = merged[merged.length - 1];
            if (h.time - last.time < 3) {
              last.end = h.time + 2;
              last.score = Math.max(last.score, h.score);
            } else {
              merged.push(h);
            }
          }
        });
        setHighlights(merged);
        setActiveTab('editor');
        return;
      }

      analyser.getByteFrequencyData(dataArray);
      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
      const avgVolume = sum / dataArray.length;

      mCtx.drawImage(video, 0, 0, 64, 64);
      const currentFrameData = mCtx.getImageData(0, 0, 64, 64).data;
      let motionScore = 0;
      if (prevFrameData) {
        for (let i = 0; i < currentFrameData.length; i += 4) {
          if (Math.abs(currentFrameData[i] - prevFrameData[i]) > 50) motionScore++;
        }
      }
      prevFrameData = currentFrameData;

      if (avgVolume > 60 || motionScore > 500) {
        if (detectedHighlights.length === 0 || video.currentTime - detectedHighlights[detectedHighlights.length-1].time > 2) {
           detectedHighlights.push({ time: video.currentTime, end: video.currentTime + 3, score: avgVolume + motionScore });
        }
      }

      setAnalyzeProgress((video.currentTime / video.duration) * 100);
      requestAnimationFrame(analyzeLoop);
    };

    analyzeLoop();
  };

  const renderVideo = async () => {
    if (!videoRef.current) return;
    setIsRendering(true);
    setRenderProgress(0);
    
    const video = videoRef.current;
    const canvas = document.getElementById('renderCanvas');
    const ctx = canvas.getContext('2d');
    
    if (ratio === '9:16') { canvas.width = 1080; canvas.height = 1920; }
    else { canvas.width = 1920; canvas.height = 1080; }

    await document.fonts.ready;

    const stream = canvas.captureStream(30);
    const audioCtx = audioCtxRef.current;
    const source = audioCtx.createMediaElementSource(video);
    const dest = audioCtx.createMediaStreamDestination();
    source.connect(dest);
    source.connect(audioCtx.destination);
    dest.stream.getAudioTracks().forEach(track => stream.addTrack(track));

    const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9,opus' });
    mediaRecorderRef.current = recorder;
    chunksRef.current = [];

    recorder.ondataavailable = (e) => { if (e.data.size > 0) chunksRef.current.push(e.data); };
    recorder.onstop = () => {
      const blob = new Blob(chunksRef.current, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `VR_Edit_${ratio.replace(':','x')}.webm`;
      a.click();
      setIsRendering(false);
      setRenderProgress(100);
    };

    video.currentTime = 0;
    video.play();
    recorder.start();

    let captionIndex = 0;

    const renderLoop = () => {
      if (video.paused || video.ended) {
        recorder.stop();
        return;
      }

      const time = video.currentTime;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const isHighlight = highlights.some(h => time >= h.time && time <= h.end);

      if (isHighlight) {
        let zoom = 1.0;
        if (intensity !== 'low') {
           const pulse = Math.sin(time * 10) * 0.05; 
           zoom = intensity === 'extreme' ? 1.15 + pulse : 1.08 + pulse;
        }
        
        if (zoom !== 1.0) {
          ctx.translate(canvas.width / 2, canvas.height / 2);
          ctx.scale(zoom, zoom);
          ctx.translate(-canvas.width / 2, -canvas.height / 2);
        }

        ctx.fillStyle = captionColor;
        ctx.fillRect(canvas.width * 0.05, canvas.height * 0.8, canvas.width * 0.9, 140);
        
        ctx.fillStyle = 'white';
        let fontString = 'bold 80px Montserrat';
        if (font === 'Bangers') fontString = '90px Bangers';
        if (font === 'Inter') fontString = '900 80px Inter';
        
        ctx.font = fontString;
        ctx.textAlign = 'center';
        
        const activeCaption = customCaptions[captionIndex % customCaptions.length];
        ctx.fillText(activeCaption.toUpperCase(), canvas.width / 2, canvas.height * 0.8 + 95);
        
        if (time % 2 < 0.1) captionIndex++;
      }

      if (!isHighlight && intensity !== 'low') {
         video.currentTime += 0.5;
      }

      setRenderProgress((video.currentTime / video.duration) * 100);
      requestAnimationFrame(renderLoop);
    };

    renderLoop();
  };

  return (
    <div className="min-h-screen pb-24">
      <header className="sticky top-0 z-50 glass px-6 py-4 flex justify-between items-center">
        <h1 className="text-xl font-extrabold tracking-tight">VR Editor <span className="neon-text">AI</span></h1>
        <div className="text-xs font-bold px-3 py-1 rounded-full bg-green-500/10 text-green-400 border border-green-500/20">● PRO</div>
      </header>

      <main className="max-w-3xl mx-auto p-4 space-y-6">
        
        {activeTab === 'dashboard' && (
          <div className="space-y-6">
            <div className="glass p-8 rounded-3xl text-center space-y-6 relative overflow-hidden">
              <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-purple-500 to-blue-500"></div>
              <h2 className="text-3xl font-extrabold tracking-tight">Create a <span className="neon-text">Masterpiece</span></h2>
              <p className="text-gray-400 text-sm max-w-xs mx-auto">Import raw VR gameplay. Our streaming AI finds the loudest, fastest moments and edits it for you.</p>
              
              <label className="neon-btn cursor-pointer inline-block w-full py-4 rounded-xl font-bold text-lg">
                <span>Import Video</span>
                <input type="file" accept="video/*" className="hidden" onChange={handleFileUpload} />
              </label>
            </div>
          </div>
        )}

        {activeTab === 'analyze' && (
          <div className="space-y-6">
            <div className="glass p-6 rounded-3xl">
              <h2 className="text-xl font-bold mb-2">AI Video Analysis</h2>
              <p className="text-sm text-gray-400 mb-6">Playing video to map audio spikes and motion detection. Keep the app open.</p>
              
              <div className="h-32 bg-black/50 rounded-xl mb-4 flex items-center justify-center border border-gray-800">
                <video ref={videoRef} src={videoUrl} onLoadedMetadata={handleVideoLoaded} className="hidden" playsInline crossOrigin="anonymous" />
                <div className="text-center">
                  <p className="text-sm font-mono text-purple-400 mb-2">{Math.floor(analyzeProgress)}% Analyzed</p>
                  <div className="w-48 h-2 bg-gray-800 rounded-full mx-auto overflow-hidden">
                    <div className="h-full bg-purple-500 transition-all" style={{ width: `${analyzeProgress}%` }}></div>
                  </div>
                </div>
              </div>

              {!isAnalyzing && highlights.length === 0 && (
                <button onClick={startAnalysis} className="neon-btn w-full py-4 rounded-xl font-bold">Start Real-Time Analysis</button>
              )}
            </div>
          </div>
        )}

        {activeTab === 'editor' && (
          <div className="space-y-4">
            
            <div className="glass p-5 rounded-3xl space-y-4 border border-purple-500/30">
              <h3 className="font-bold text-sm uppercase tracking-wider text-purple-400">🧠 Real Game Intel Agent</h3>
              <p className="text-xs text-gray-400">The AI will search YouTube for recent Shorts of this game, read their transcripts, and apply the exact viral style they are using.</p>
              <div className="flex gap-2">
                <input type="text" placeholder="e.g. Gorilla Tag" value={gameName} onChange={(e) => setGameName(e.target.value)} className="flex-1 bg-gray-900 border border-gray-800 rounded-xl p-3 text-white outline-none" />
                <button onClick={researchGameStyle} disabled={isResearching} className="neon-btn px-4 py-3 rounded-xl font-bold text-sm">
                  {isResearching ? 'Analyzing...' : 'Research'}
                </button>
              </div>
              {customCaptions.length > 0 && (
                <p className="text-xs text-green-400 font-mono">Active Captions: {customCaptions.join(" | ")}</p>
              )}
            </div>

            <div className="glass p-5 rounded-3xl space-y-4">
              <h3 className="font-bold text-sm uppercase tracking-wider text-gray-400">Format</h3>
              <div className="flex gap-3">
                <button onClick={() => setRatio('9:16')} className={`flex-1 py-3 rounded-xl font-bold border ${ratio === '9:16' ? 'bg-purple-600 border-purple-500 text-white' : 'bg-gray-900 border-gray-800 text-gray-400'}`}>Shorts (9:16)</button>
                <button onClick={() => setRatio('16:9')} className={`flex-1 py-3 rounded-xl font-bold border ${ratio === '16:9' ? 'bg-purple-600 border-purple-500 text-white' : 'bg-gray-900 border-gray-800 text-gray-400'}`}>Long (16:9)</button>
              </div>
            </div>

            <div className="glass p-5 rounded-3xl space-y-4">
              <h3 className="font-bold text-sm uppercase tracking-wider text-gray-400">Styling</h3>
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="text-xs text-gray-500 font-bold mb-1 block">Font</label>
                  <select value={font} onChange={(e) => setFont(e.target.value)} className="w-full bg-gray-900 border border-gray-800 rounded-xl p-3 text-white outline-none">
                    <option value="Montserrat">Montserrat</option>
                    <option value="Bangers">Bangers</option>
                    <option value="Inter">Inter</option>
                  </select>
                </div>
                <div>
                  <label className="text-xs text-gray-500 font-bold mb-1 block">Color</label>
                  <input type="color" value={captionColor} onChange={(e) => setCaptionColor(e.target.value)} className="w-full h-12 bg-gray-900 border border-gray-800 rounded-xl cursor-pointer" />
                </div>
              </div>
            </div>

            <div className="glass p-5 rounded-3xl">
              <h3 className="font-bold text-sm uppercase tracking-wider text-gray-400 mb-2">Timeline Map</h3>
              <div className="timeline-track">
                {highlights.map((h, i) => (
                  <div key={i} className="timeline-highlight" style={{ left: `${(h.time / videoDuration) * 100}%`, width: `${((h.end - h.time) / videoDuration) * 100}%` }} />
                ))}
              </div>
            </div>

            <button onClick={() => setActiveTab('export')} className="neon-btn w-full py-4 rounded-xl font-bold mt-4">Continue to Export</button>
          </div>
        )}

        {activeTab === 'export' && (
          <div className="space-y-6">
            <div className="glass p-8 rounded-3xl text-center space-y-6">
              <h2 className="text-2xl font-bold">Render Studio</h2>
              <p className="text-sm text-gray-400">Render locally. Do not lock your screen.</p>

              {isRendering ? (
                <div className="space-y-2">
                  <div className="h-2 w-full bg-gray-800 rounded-full overflow-hidden">
                    <div className="h-full bg-blue-500 transition-all" style={{ width: `${renderProgress}%` }}></div>
                  </div>
                  <p className="text-xs text-blue-400 font-mono">Rendering... {Math.floor(renderProgress)}%</p>
                </div>
              ) : (
                <button onClick={renderVideo} className="neon-btn w-full py-4 rounded-xl font-bold">Render & Download</button>
              )}
            </div>
          </div>
        )}

        {activeTab === 'settings' && (
          <div className="space-y-6">
            <div className="glass p-6 rounded-3xl space-y-4">
              <h2 className="text-xl font-bold">Settings</h2>
              <div>
                <label className="text-xs text-gray-500 font-bold mb-1 block">Gemini API Key</label>
                <input type="password" placeholder="Paste your Gemini key..." value={geminiKey} onChange={(e) => setGeminiKey(e.target.value)} className="w-full bg-gray-900 border border-gray-800 rounded-xl p-3 text-white outline-none" />
              </div>
              <div>
                <label className="text-xs text-gray-500 font-bold mb-1 block">YouTube API Key</label>
                <input type="password" placeholder="Paste your YouTube key..." value={ytKey} onChange={(e) => setYtKey(e.target.value)} className="w-full bg-gray-900 border border-gray-800 rounded-xl p-3 text-white outline-none" />
              </div>
              <div>
                <label className="text-xs text-gray-500 font-bold mb-1 block">Transcript API Key</label>
                <input type="password" placeholder="Paste your Transcript key..." value={transcriptKey} onChange={(e) => setTranscriptKey(e.target.value)} className="w-full bg-gray-900 border border-gray-800 rounded-xl p-3 text-white outline-none" />
              </div>
              <button onClick={saveSettings} className="neon-btn w-full py-3 rounded-xl font-bold">Save All Keys</button>
            </div>
          </div>
        )}

      </main>

      <nav className="fixed bottom-0 left-0 right-0 glass flex justify-around py-4 z-50">
        {['dashboard', 'analyze', 'editor', 'export', 'settings'].map(tab => (
          <button key={tab} onClick={() => setActiveTab(tab)} className={`flex flex-col items-center gap-1 text-[10px] font-bold uppercase tracking-wider ${activeTab === tab ? 'text-purple-400' : 'text-gray-600'}`}>
            <div className={`w-8 h-8 rounded-xl flex items-center justify-center ${activeTab === tab ? 'bg-purple-500/20' : ''}`}>
              {tab[0].toUpperCase()}
            </div>
            <span>{tab}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050508">
<title>VR Editor AI — Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Bangers&family=Montserrat:wght@900&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; background-color: #050508; color: #f8fafc; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  .glass { background: rgba(20, 20, 28, 0.7); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.08); }
  .neon-text { background: linear-gradient(135deg, #8b5cf6, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .neon-btn { background: linear-gradient(135deg, #8b5cf6, #3b82f6); box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3); transition: all 0.15s; }
  .neon-btn:active { transform: scale(0.97); opacity: 0.9; }
  .timeline-container { background: #121215; border: 1px solid #27272a; border-radius: 8px; overflow: hidden; position: relative; }
  .toggle-checkbox { display: none; }
  .toggle-label { display: flex; align-items: center; justify-content: space-between; cursor: pointer; padding: 10px 0; border-bottom: 1px solid #27272a; font-size: 14px; font-weight: 600; }
  .toggle-switch { position: relative; width: 44px; height: 24px; background: #3f3f46; border-radius: 12px; transition: 0.3s; }
  .toggle-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: white; border-radius: 50%; transition: 0.3s; }
  .toggle-checkbox:checked + .toggle-switch { background: #8b5cf6; }
  .toggle-checkbox:checked + .toggle-switch::after { transform: translateX(20px); }
</style>
</head>
<body>
<div id="root"></div>
<canvas id="motionCanvas" width="64" height="64" class="hidden"></canvas>
<canvas id="renderCanvas" class="hidden"></canvas>
<canvas id="timelineCanvas" width="1000" height="100"></canvas>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

function App() {
  const [activeTab, setActiveTab] = useState('dashboard');
  const [videoFile, setVideoFile] = useState(null);
  const [videoUrl, setVideoUrl] = useState('');
  const [videoDuration, setVideoDuration] = useState(0);
  const [isAnalyzing, setIsAnalyzing] = useState(false);
  const [analyzeProgress, setAnalyzeProgress] = useState(0);
  
  // Analysis Data
  const [highlights, setHighlights] = useState([]);
  const [deadSpace, setDeadSpace] = useState([]);
  const [waveform, setWaveform] = useState([]);
  
  // Pro Settings
  const [ratio, setRatio] = useState('9:16');
  const [intensity, setIntensity] = useState('medium');
  const [font, setFont] = useState('Montserrat');
  const [captionColor, setCaptionColor] = useState('#8b5cf6');
  const [textAnimation, setTextAnimation] = useState('bounce');
  
  // Top-Tier Toggles
  const [showSafeZone, setShowSafeZone] = useState(true);
  const [audioDucking, setAudioDucking] = useState(true);
  const [impactEffects, setImpactEffects] = useState(true);
  const [memeSFX, setMemeSFX] = useState(true);
  const [beatSync, setBeatSync] = useState(true);
  
  // Custom Assets
  const [customFontName, setCustomFontName] = useState('');
  const [musicUrl, setMusicUrl] = useState(null);
  const [musicVolume, setMusicVolume] = useState(0.3);
  
  // Live Transcription & AI Agent
  const [liveCaption, setLiveCaption] = useState('');
  const [agentStatus, setAgentStatus] = useState('');
  const [geminiKey, setGeminiKey] = useState(localStorage.getItem('vr_editor_gemini') || '');
  const [ytKey, setYtKey] = useState(localStorage.getItem('vr_editor_yt') || '');
  const [transcriptKey, setTranscriptKey] = useState(localStorage.getItem('vr_editor_transcript') || '');
  const [gameName, setGameName] = useState('');
  const [isResearching, setIsResearching] = useState(false);
  const [customCaptions, setCustomCaptions] = useState(["EPIC MOMENT", "NO WAY", "CLUTCH"]);
  
  // Render State
  const [isRendering, setIsRendering] = useState(false);
  const [renderProgress, setRenderProgress] = useState(0);

  const videoRef = useRef(null);
  const audioCtxRef = useRef(null);
  const videoSourceRef = useRef(null); // Fixed: Store the audio source here
  const mediaRecorderRef = useRef(null);
  const chunksRef = useRef([]);

  const saveSettings = () => {
    localStorage.setItem('vr_editor_gemini', geminiKey);
    localStorage.setItem('vr_editor_yt', ytKey);
    localStorage.setItem('vr_editor_transcript', transcriptKey);
    alert("All API Keys saved!");
  };

  const handleFileUpload = (e) => {
    const file = e.target.files[0];
    if (file) {
      setVideoFile(file);
      setVideoUrl(URL.createObjectURL(file));
      setHighlights([]); setDeadSpace([]); setWaveform([]);
      setAnalyzeProgress(0);
      setActiveTab('analyze');
    }
  };

  const handleFontUpload = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const url = URL.createObjectURL(file);
      const loadedFont = new FontFace('UserCustomFont', `url(${url})`);
      await loadedFont.load();
      document.fonts.add(loadedFont);
      setCustomFontName('UserCustomFont');
      alert("Custom font loaded!");
    } catch (err) { alert("Failed to load font. Make sure it is a .ttf or .otf file."); }
  };

  const scrapeWikiContext = async (game) => {
    try {
      setAgentStatus("Scraping game wiki for mechanics...");
      const formattedName = game.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
      const wikiTitle = game.replace(/\s+/g, '_');
      const targetUrl = `https://${formattedName}.fandom.com/wiki/${wikiTitle}`;
      const corsProxy = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
      
      const response = await fetch(corsProxy);
      const data = await response.json();
      
      if (!data.contents) return "No wiki data found.";
      
      const parser = new DOMParser();
      const doc = parser.parseFromString(data.contents, "text/html");
      
      const paragraphs = Array.from(doc.querySelectorAll('.mw-parser-output p'))
        .slice(0, 5)
        .map(p => p.textContent)
        .join(' ');
        
      return paragraphs.substring(0, 2000) || "Wiki text was empty.";
    } catch (err) {
      return "Wiki scraping failed.";
    }
  };

  const researchGameStyle = async () => {
    if (!geminiKey || !ytKey || !transcriptKey) { alert("Add all 3 API keys in Settings."); return; }
    if (!gameName) { alert("Enter game name."); return; }
    
    setIsResearching(true);
    let videoData = "";

    try {
      const wikiContext = await scrapeWikiContext(gameName);

      setAgentStatus("Searching YouTube for viral Shorts...");
      const searchUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(gameName + ' VR shorts')}&type=video&order=viewCount&maxResults=3&key=${ytKey}`;
      const searchRes = await fetch(searchUrl);
      const searchData = await searchRes.json();
      
      if (searchData.items && searchData.items.length > 0) {
        for (const item of searchData.items) {
          setAgentStatus("Reading YouTube transcripts...");
          let transcriptText = "Transcript unavailable.";
          try {
            const trRes = await fetch(`https://youtube-transcript.ai/transcript/${item.id.videoId}.txt?key=${transcriptKey}`);
            if (trRes.ok) transcriptText = (await trRes.text()).substring(0, 1500);
          } catch (e) { /* Ignore */ }
          videoData += `VIDEO: "${item.snippet.title}"\nTRANSCRIPT: "${transcriptText}"\n\n`;
        }
      }

      setAgentStatus("Analyzing data with Gemini...");
      const prompt = `You are a viral YouTube Shorts editor. I am editing "${gameName}".
      
      Here is the actual lore and mechanics of the game from the Wiki:
      ${wikiContext}
      
      Here is what the top creators are saying in their viral videos:
      ${videoData}
      
      Based on BOTH the actual game mechanics and the viral video trends, what editing style and specific comedic captions should I use?
      
      Respond ONLY with a valid JSON object (no markdown, no backticks):
      {
        "font": "Bangers" or "Montserrat" or "Inter",
        "color": "#ff0000",
        "intensity": "low" or "medium" or "extreme",
        "captions": ["3 viral words based on the game's mechanics"]
      }`;

      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
      });
      
      const data = await res.json();
      let text = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
      const result = JSON.parse(text);
      
      setFont(result.font);
      setCaptionColor(result.color);
      setIntensity(result.intensity);
      setCustomCaptions(result.captions);
      alert(`Research Complete! Applied style for ${gameName}.`);
    } catch (err) {
      alert("Research failed. Check API limits.");
    } finally {
      setAgentStatus('');
      setIsResearching(false);
    }
  };

  const drawTimeline = (duration, wf, hl, ds) => {
    const canvas = document.getElementById('timelineCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width; const h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    
    ctx.fillStyle = '#1c1c21'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(239, 68, 68, 0.3)';
    ds.forEach(d => { ctx.fillRect((d.start / duration) * w, 0, ((d.end - d.start) / duration) * w, h); });
    ctx.fillStyle = 'rgba(139, 92, 246, 0.5)';
    hl.forEach(hl => { ctx.fillRect((hl.time / duration) * w, 0, ((hl.end - hl.time) / duration) * w, h); });
    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
    wf.forEach((val, i) => {
      let x = (i / wf.length) * w;
      let amp = (val / 255) * h;
      ctx.fillRect(x, h/2 - amp/2, 1, amp); 
    });
  };

  useEffect(() => {
    if (videoDuration > 0) drawTimeline(videoDuration, waveform, highlights, deadSpace);
  }, [highlights, deadSpace, waveform, videoDuration]);

  const startAnalysis = async () => {
    if (!videoRef.current) return;
    setIsAnalyzing(true);
    setHighlights([]); setDeadSpace([]); setWaveform([]);
    
    const video = videoRef.current;
    video.muted = false; video.currentTime = 0;
    
    // FIX: Reuse AudioContext and Source Node
    if (!audioCtxRef.current) audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
    const audioCtx = audioCtxRef.current;
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    
    if (!videoSourceRef.current) {
      videoSourceRef.current = audioCtx.createMediaElementSource(video);
    }
    const source = videoSourceRef.current;
    source.disconnect(); // Disconnect from any previous renders
    
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);
    
    const dataArray = new Uint8Array(analyser.frequencyBinCount);
    let detectedHighlights = [], detectedDeadSpace = [], detectedWaveform = [], silenceStart = null;
    const mCanvas = document.getElementById('motionCanvas');
    const mCtx = mCanvas.getContext('2d', { willReadFrequently: true });
    let prevFrameData = null;

    video.play();

    const analyzeLoop = () => {
      if (video.paused || video.ended) {
        setIsAnalyzing(false); setAnalyzeProgress(100); source.disconnect();
        if (silenceStart && video.currentTime - silenceStart > 2) detectedDeadSpace.push({ start: silenceStart, end: video.currentTime });
        setHighlights(detectedHighlights); setDeadSpace(detectedDeadSpace); setWaveform(detectedWaveform);
        setActiveTab('editor');
        return;
      }

      analyser.getByteFrequencyData(dataArray);
      let sum = 0; for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
      const avgVolume = sum / dataArray.length;
      
      if (detectedWaveform.length < (video.currentTime * 10)) detectedWaveform.push(avgVolume);

      mCtx.drawImage(video, 0, 0, 64, 64);
      const currentFrameData = mCtx.getImageData(0, 0, 64, 64).data;
      let motionScore = 0;
      if (prevFrameData) {
        for (let i = 0; i < currentFrameData.length; i += 4) {
          if (Math.abs(currentFrameData[i] - prevFrameData[i]) > 50) motionScore++;
        }
      }
      prevFrameData = currentFrameData;

      if (avgVolume < 15 && motionScore < 100) {
        if (!silenceStart) silenceStart = video.currentTime;
      } else {
        if (silenceStart && video.currentTime - silenceStart > 2) detectedDeadSpace.push({ start: silenceStart, end: video.currentTime });
        silenceStart = null;
      }

      if (avgVolume > 60 || motionScore > 500) {
        if (detectedHighlights.length === 0 || video.currentTime - detectedHighlights[detectedHighlights.length-1].time > 2) {
           detectedHighlights.push({ time: video.currentTime, end: video.currentTime + 3 });
        }
      }

      setAnalyzeProgress((video.currentTime / video.duration) * 100);
      requestAnimationFrame(analyzeLoop);
    };
    analyzeLoop();
  };

  const renderVideo = async () => {
    if (!videoRef.current) return;
    setIsRendering(true); setRenderProgress(0);
    
    try {
      const video = videoRef.current;
      const canvas = document.getElementById('renderCanvas');
      const ctx = canvas.getContext('2d');
      
      // Lower resolution slightly for Android stability
      if (ratio === '9:16') { canvas.width = 720; canvas.height = 1280; }
      else { canvas.width = 1280; canvas.height = 720; }

      await document.fonts.ready;

      const stream = canvas.captureStream(30);
      const audioCtx = audioCtxRef.current;
      
      const dest = audioCtx.createMediaStreamDestination();
      
      // FIX: Reuse the source node!
      let source = videoSourceRef.current;
      if (!source) {
         source = audioCtx.createMediaElementSource(video);
         videoSourceRef.current = source;
      }
      source.disconnect(); // Clear old connections
      source.connect(dest);
      source.connect(audioCtx.destination);

      let musicSource = null, musicAudio = null, musicGain = null;
      if (musicUrl) {
        musicAudio = new Audio(musicUrl); musicAudio.loop = true;
        musicSource = audioCtx.createMediaElementSource(musicAudio);
        musicGain = audioCtx.createGain();
        musicGain.gain.value = musicVolume;
        musicSource.connect(musicGain);
        musicGain.connect(dest);
        musicGain.connect(audioCtx.destination);
        musicAudio.play();
      }
      
      dest.stream.getAudioTracks().forEach(track => stream.addTrack(track));

      // Live Captions (with safety net)
      let recognition = null;
      try {
        if (window.SpeechRecognition || window.webkitSpeechRecognition) {
          const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
          recognition = new SpeechRecognition();
          recognition.continuous = true;
          recognition.interimResults = true;
          recognition.onresult = (event) => {
            let current = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
              current += event.results[i][0].transcript;
            }
            setLiveCaption(current);
          };
          recognition.start();
        }
      } catch (e) { console.warn("Speech Recognition blocked"); }

      // MIME Type fallback for Android
      let options = { mimeType: 'video/webm;codecs=vp9,opus' };
      if (!MediaRecorder.isTypeSupported(options.mimeType)) {
        options = { mimeType: 'video/webm;codecs=vp8,opus' };
        if (!MediaRecorder.isTypeSupported(options.mimeType)) {
          options = { mimeType: 'video/webm' };
        }
      }

      const recorder = new MediaRecorder(stream, options);
      mediaRecorderRef.current = recorder;
      chunksRef.current = [];

      recorder.ondataavailable = (e) => { if (e.data.size > 0) chunksRef.current.push(e.data); };
      recorder.onstop = () => {
        if (musicAudio) musicAudio.pause();
        if (recognition) recognition.stop();
        const blob = new Blob(chunksRef.current, { type: options.mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = `VR_Edit_${ratio.replace(':','x')}.webm`; a.click();
        setIsRendering(false); setRenderProgress(100);
      };

      video.currentTime = 0;
      video.play();
      recorder.start();

      let lastHighlightTime = -10;
      let shakeFrames = 0;
      let flashFrames = 0;

      const renderLoop = () => {
        if (video.paused || video.ended) { 
          recorder.stop(); 
          return; 
        }

        const time = video.currentTime;
        
        // Audio Ducking
        if (audioDucking && musicGain) {
          const analyser = audioCtx.createAnalyser();
          source.connect(analyser);
          const dataArray = new Uint8Array(analyser.frequencyBinCount);
          analyser.getByteFrequencyData(dataArray);
          let sum = 0; for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
          musicGain.gain.value = (sum / dataArray.length) > 50 ? 0.05 : musicVolume;
          source.disconnect(analyser);
        }

        const isHighlight = highlights.some(h => time >= h.time && time <= h.end);
        const newHighlight = isHighlight && (time - lastHighlightTime > 2);
        
        if (newHighlight) {
          lastHighlightTime = time;
          if (impactEffects) { shakeFrames = 15; flashFrames = 5; }
          if (memeSFX) {
             const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
             osc.type = 'sine'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
             osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
             gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
             gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
             osc.connect(gain); gain.connect(dest); osc.start(); osc.stop(audioCtx.currentTime + 0.5);
          }
        }

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        
        if (shakeFrames > 0) {
          ctx.translate((Math.random() - 0.5) * 30, (Math.random() - 0.5) * 30);
          shakeFrames--;
        }

        if (beatSync && musicUrl) {
          const beatScale = 1 + Math.abs(Math.sin(time * Math.PI)) * 0.03;
          ctx.translate(canvas.width/2, canvas.height/2); ctx.scale(beatScale, beatScale); ctx.translate(-canvas.width/2, -canvas.height/2);
        }

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        if (isHighlight) {
          let zoom = 1.08 + Math.sin(time * 10) * 0.05;
          if (intensity === 'extreme') zoom = 1.15 + Math.sin(time * 10) * 0.05;
          
          ctx.translate(canvas.width / 2, canvas.height / 2); ctx.scale(zoom, zoom); ctx.translate(-canvas.width / 2, -canvas.height / 2);

          ctx.fillStyle = captionColor;
          ctx.fillRect(canvas.width * 0.05, canvas.height * 0.8, canvas.width * 0.9, 100);
          
          ctx.fillStyle = 'white';
          ctx.font = customFontName ? `70px "${customFontName}"` : `bold 60px ${font}`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          
          let displayCaption = liveCaption ? liveCaption.toUpperCase() : customCaptions[0];
          ctx.save();
          let textX = canvas.width / 2; let textY = canvas.height * 0.8 + 50;

          if (textAnimation === 'bounce') textY -= Math.abs(Math.sin(time * 15)) * 20;
          else if (textAnimation === 'shake') { textX += (Math.random() - 0.5) * 15; textY += (Math.random() - 0.5) * 15; }

          ctx.fillText(displayCaption.substring(0, 20), textX, textY);
          ctx.restore();
        }

        if (flashFrames > 0) {
          ctx.fillStyle = `rgba(255, 255, 255, ${flashFrames * 0.15})`;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          flashFrames--;
        }

        if (showSafeZone && ratio === '9:16') {
          ctx.strokeStyle = 'rgba(255, 0, 0, 0.5)'; ctx.lineWidth = 4; ctx.setLineDash([20, 20]);
          ctx.strokeRect(40, 150, canvas.width - 80, canvas.height - 400);
          ctx.setLineDash([]);
        }

        if (intensity !== 'low') {
          const currentDead = deadSpace.find(d => time >= d.start && time <= d.end);
          if (currentDead) {
             video.currentTime = currentDead.end; // Skip the boring part!
          }
          else if (!isHighlight && intensity === 'extreme') video.currentTime += 0.2;
        }

        setRenderProgress((video.currentTime / video.duration) * 100);
        requestAnimationFrame(renderLoop);
      };
      renderLoop();
      
    } catch (error) {
      console.error(error);
      alert("Render Error: " + error.message + "\nYour phone might be out of memory. Try a shorter video.");
      setIsRendering(false);
    }
  };

  return (
    <div className="min-h-screen pb-24">
      <header className="sticky top-0 z-50 glass px-6 py-4 flex justify-between items-center">
        <h1 className="text-xl font-extrabold tracking-tight">VR Editor <span className="neon-text">AI</span></h1>
        <div className="text-xs font-bold px-3 py-1 rounded-full bg-green-500/10 text-green-400 border border-green-500/20">● PRO</div>
      </header>

      <main className="max-w-3xl mx-auto p-4 space-y-6">
        
        {activeTab === 'dashboard' && (
          <div className="glass p-8 rounded-3xl text-center space-y-6">
            <h2 className="text-3xl font-extrabold tracking-tight">Create a <span className="neon-text">Masterpiece</span></h2>
            <p className="text-gray-400 text-sm">Import raw VR gameplay. AI finds loud/fast moments, cuts silence, and applies effects.</p>
            <label className="neon-btn cursor-pointer block w-full py-4 rounded-xl font-bold text-lg">
              <span>Import Video</span>
              <input type="file" accept="video/*" className="hidden" onChange={handleFileUpload} />
            </label>
          </div>
        )}

        {activeTab === 'analyze' && (
          <div className="glass p-6 rounded-3xl space-y-4">
            <h2 className="text-xl font-bold">AI Analysis</h2>
            <div className="h-32 bg-black/50 rounded-xl flex items-center justify-center border border-gray-800">
              <video ref={videoRef} src={videoUrl} onLoadedMetadata={(e) => setVideoDuration(e.target.duration)} className="hidden" playsInline crossOrigin="anonymous" />
              <div className="text-center">
                <p className="text-sm font-mono text-purple-400 mb-2">{Math.floor(analyzeProgress)}% Analyzed</p>
                <div className="w-48 h-2 bg-gray-800 rounded-full mx-auto overflow-hidden">
                  <div className="h-full bg-purple-500 transition-all" style={{ width: `${analyzeProgress}%` }}></div>
                </div>
              </div>
            </div>
            {!isAnalyzing && highlights.length === 0 && (
              <button onClick={startAnalysis} className="neon-btn w-full py-4 rounded-xl font-bold">Start Analysis</button>
            )}
          </div>
        )}

        {activeTab === 'editor' && (
          <div className="space-y-4">
            <div className="glass p-5 rounded-3xl space-y-4 border border-purple-500/30">
              <h3 className="font-bold text-sm uppercase tracking-wider text-purple-400">🧠 Real Game Intel Agent</h3>
              <div className="flex gap-2">
                <input type="text" placeholder="e.g. Blade & Sorcery" value={gameName} onChange={(e) => setGameName(e.target.value)} className="flex-1 bg-gray-900 border border-gray-800 rounded-xl p-3 text-white outline-none" />
                <button onClick={researchGameStyle} disabled={isResearching} className="neon-btn px-4 py-3 rounded-xl font-bold text-sm">
                  {isResearching ? 'Working...' : 'Research'}
                </button>
              </div>
              {agentStatus && <p className="text-xs text-blue-400 font-mono animate-pulse">{agentStatus}</p>}
              {customCaptions.length > 0 && <p className="text-xs text-green-400 font-mono">Active Captions: {customCaptions.join(" | ")}</p>}
            </div>

            <div className="glass p-5 rounded-3xl">
              <h3 className="font-bold text-sm uppercase text-gray-400 mb-2">Timeline Map</h3>
              <canvas id="timelineCanvas" className="w-full h-[100px] rounded-lg" />
            </div>

            <div className="glass p-5 rounded-3xl space-y-2">
              <h3 className="font-bold text-sm uppercase text-gray-400 mb-2">Pro Features</h3>
              <label className="toggle-label">Safe Zone Overlay <input type="checkbox" className="toggle-checkbox" checked={showSafeZone} onChange={(e) => setShowSafeZone(e.target.checked)} /><div className="toggle-switch"></div></label>
              <label className="toggle-label">Audio Ducking <input type="checkbox" className="toggle-checkbox" checked={audioDucking} onChange={(e) => setAudioDucking(e.target.checked)} /><div className="toggle-switch"></div></label>
              <label className="toggle-label">Impact Shakes & Flashes <input type="checkbox" className="toggle-checkbox" checked={impactEffects} onChange={(e) => setImpactEffects(e.target.checked)} /><div className="toggle-switch"></div></label>
              <label className="toggle-label">Meme SFX <input type="checkbox" className="toggle-checkbox" checked={memeSFX} onChange={(e) => setMemeSFX(e.target.checked)} /><div className="toggle-switch"></div></label>
              <label className="toggle-label">Beat Sync Pulse <input type="checkbox" className="toggle-checkbox" checked={beatSync} onChange={(e) => setBeatSync(e.target.checked)} /><div className="toggle-switch"></div></label>
            </div>

            <div className="glass p-5 rounded-3xl space-y-4">
              <h3 className="font-bold text-sm uppercase text-gray-400">Custom Assets</h3>
              <div className="flex gap-2">
                <label className="flex-1 cursor-pointer bg-gray-900 border border-gray-800 rounded-xl p-3 text-center text-sm font-bold text-gray-300">
                  <span>Font (.ttf)</span><input type="file" accept=".ttf,.otf" className="hidden" onChange={handleFontUpload} />
                </label>
                <label className="flex-1 cursor-pointer bg-gray-900 border border-gray-800 rounded-xl p-3 text-center text-sm font-bold text-gray-300">
                  <span>Music</span><input type="file" accept="audio/*" className="hidden" onChange={(e) => setMusicUrl(URL.createObjectURL(e.target.files[0]))} />
                </label>
              </div>
            </div>

            <div className="glass p-5 rounded-3xl space-y-4">
              <h3 className="font-bold text-sm uppercase text-gray-400">Intensity</h3>
              <input type="range" min="1" max="3" value={intensity === 'low' ? 1 : intensity === 'medium' ? 2 : 3} onChange={(e) => setIntensity(e.target.value === '1' ? 'low' : e.target.value === '2' ? 'medium' : 'extreme')} className="w-full accent-purple-500" />
            </div>

            <button onClick={() => setActiveTab('export')} className="neon-btn w-full py-4 rounded-xl font-bold">Continue to Export</button>
          </div>
        )}

        {activeTab === 'export' && (
          <div className="glass p-8 rounded-3xl text-center space-y-6">
            <h2 className="text-2xl font-bold">Render Studio</h2>
            <p className="text-sm text-gray-400">Keep screen on. Ducking, SFX, and Captions are active.</p>
            {isRendering ? (
              <div className="space-y-2">
                <div className="h-2 w-full bg-gray-800 rounded-full overflow-hidden">
                  <div className="h-full bg-blue-500 transition-all" style={{ width: `${renderProgress}%` }}></div>
                </div>
                <p className="text-xs text-blue-400 font-mono">Rendering... {Math.floor(renderProgress)}%</p>
                <p className="text-xs text-purple-400 mt-2">🎤 Live Mic: {liveCaption || "Listening..."}</p>
              </div>
            ) : (
              <button onClick={renderVideo} className="neon-btn w-full py-4 rounded-xl font-bold">Render & Download</button>
            )}
          </div>
        )}

        {activeTab === 'settings' && (
          <div className="glass p-6 rounded-3xl space-y-4">
            <h2 className="text-xl font-bold">API Keys</h2>
            <input type="password" placeholder="Gemini Key" value={geminiKey} onChange={(e) => setGeminiKey(e.target.value)} className="w-full bg-gray-900 p-3 rounded-xl border border-gray-800 text-white" />
            <input type="password" placeholder="YouTube Key" value={ytKey} onChange={(e) => setYtKey(e.target.value)} className="w-full bg-gray-900 p-3 rounded-xl border border-gray-800 text-white" />
            <input type="password" placeholder="Transcript Key" value={transcriptKey} onChange={(e) => setTranscriptKey(e.target.value)} className="w-full bg-gray-900 p-3 rounded-xl border border-gray-800 text-white" />
            <button onClick={saveSettings} className="neon-btn w-full py-3 rounded-xl font-bold">Save Keys</button>
          </div>
        )}

      </main>

      <nav className="fixed bottom-0 left-0 right-0 glass flex justify-around py-4 z-50">
        {['dashboard', 'analyze', 'editor', 'export', 'settings'].map(tab => (
          <button key={tab} onClick={() => setActiveTab(tab)} className={`flex flex-col items-center gap-1 text-[10px] font-bold uppercase tracking-wider ${activeTab === tab ? 'text-purple-400' : 'text-gray-600'}`}>
            <div className={`w-8 h-8 rounded-xl flex items-center justify-center ${activeTab === tab ? 'bg-purple-500/20' : ''}`}>{tab[0].toUpperCase()}</div>
            <span>{tab}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>

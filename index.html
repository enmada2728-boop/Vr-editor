<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050508">
<title>VR Editor AI — PRO ENGINE 3.0</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Bangers&family=Montserrat:wght@900&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; background-color: #050508; color: #f8fafc; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  .glass { background: rgba(20, 20, 28, 0.7); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.08); }
  .neon-text { background: linear-gradient(135deg, #8b5cf6, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .neon-btn { background: linear-gradient(135deg, #8b5cf6, #3b82f6); box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3); transition: all 0.15s; }
  .neon-btn:active { transform: scale(0.97); opacity: 0.9; }
</style>
</head>
<body>
<div id="root"></div>
<canvas id="motionCanvas" width="64" height="64" class="hidden"></canvas>
<canvas id="renderCanvas" class="hidden"></canvas>
<canvas id="timelineCanvas" width="1000" height="100"></canvas>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// --- PRO SFX GENERATOR ---
const playSFX = (audioCtx, dest, type) => {
  const t = audioCtx.currentTime;
  if (type === 'boom') {
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(150, t);
    osc.frequency.exponentialRampToValueAtTime(40, t + 0.4);
    gain.gain.setValueAtTime(0.8, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
    osc.connect(gain); gain.connect(dest); osc.start(t); osc.stop(t + 0.5);
  } else if (type === 'whoosh') {
    const bufferSize = audioCtx.sampleRate * 0.4;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter(); filter.type = 'bandpass';
    filter.frequency.setValueAtTime(800, t); filter.frequency.exponentialRampToValueAtTime(200, t + 0.3);
    const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.4, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
    noise.connect(filter); filter.connect(gain); gain.connect(dest); noise.start(t);
  }
};

function App() {
  const [activeTab, setActiveTab] = useState('dashboard');
  const [videoFile, setVideoFile] = useState(null);
  const [videoUrl, setVideoUrl] = useState('');
  const [videoDuration, setVideoDuration] = useState(0);
  
  const [isAnalyzing, setIsAnalyzing] = useState(false);
  const [analyzeProgress, setAnalyzeProgress] = useState(0);
  const [timelineData, setTimelineData] = useState([]); // Array of Keep Segments
  
  const [ratio, setRatio] = useState('9:16');
  const [intensity, setIntensity] = useState('medium');
  const [font, setFont] = useState('Montserrat');
  const [captionColor, setCaptionColor] = useState('#8b5cf6');
  
  const [audioDucking, setAudioDucking] = useState(true);
  const [smartSFX, setSmartSFX] = useState(true);
  const [proCamera, setProCamera] = useState(true);
  const [flashCuts, setFlashCuts] = useState(true);
  const [blurBg, setBlurBg] = useState(true);
  const [colorGrade, setColorGrade] = useState(true);
  
  const [customFontName, setCustomFontName] = useState('');
  const [musicUrl, setMusicUrl] = useState(null);
  const [musicVolume, setMusicVolume] = useState(0.2);
  
  const [isRendering, setIsRendering] = useState(false);
  const [renderProgress, setRenderProgress] = useState(0);
  const [renderStatus, setRenderStatus] = useState('');
  const [renderError, setRenderError] = useState('');

  const videoRef = useRef(null);
  const audioCtxRef = useRef(null);
  const chunksRef = useRef([]);

  const handleFileUpload = (e) => {
    const file = e.target.files[0];
    if (file) {
      setVideoFile(file); setVideoUrl(URL.createObjectURL(file));
      setTimelineData([]);
      setRenderError(''); setRenderStatus(''); setAnalyzeProgress(0);
      setActiveTab('analyze');
    }
  };

  const handleFontUpload = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const url = URL.createObjectURL(file);
      const loadedFont = new FontFace('UserCustomFont', `url(${url})`);
      await loadedFont.load(); document.fonts.add(loadedFont); setCustomFontName('UserCustomFont');
      alert("Custom font loaded!");
    } catch (err) { alert("Failed to load font."); }
  };

  const drawTimeline = (duration, data) => {
    const canvas = document.getElementById('timelineCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width; const h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    
    ctx.fillStyle = '#1c1c21'; ctx.fillRect(0, 0, w, h); // Default is cut
    
    // Draw keep segments
    data.forEach(seg => {
      ctx.fillStyle = 'rgba(139, 92, 246, 0.6)';
      ctx.fillRect((seg.start / duration) * w, 0, ((seg.end - seg.start) / duration) * w, h); 
    });
  };

  useEffect(() => {
    if (videoDuration > 0) drawTimeline(videoDuration, timelineData);
  }, [timelineData, videoDuration]);

  // --- ULTIMATE SMART CUT ENGINE ---
  const startAnalysis = async () => {
    if (!videoRef.current) return;
    setIsAnalyzing(true); setTimelineData([]);
    
    const video = videoRef.current;
    video.muted = false; video.currentTime = 0;
    
    if (!audioCtxRef.current) audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
    const audioCtx = audioCtxRef.current;
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    
    const source = audioCtx.createMediaElementSource(video);
    const analyser = audioCtx.createAnalyser(); analyser.fftSize = 256;
    source.connect(analyser);
    
    const dataArray = new Uint8Array(analyser.frequencyBinCount);
    let frames = [];
    
    const mCanvas = document.getElementById('motionCanvas');
    const mCtx = mCanvas.getContext('2d', { willReadFrequently: true });
    let prevFrameData = null;

    video.play();

    const analyzeLoop = () => {
      if (video.paused || video.ended) {
        setIsAnalyzing(false); setAnalyzeProgress(100); source.disconnect();
        
        // --- BUILD THE EDL (KEEP SEGMENTS) ---
        let segments = [];
        let isKeeping = false;
        let keepStart = 0;
        let silenceCounter = 0;
        
        frames.forEach((f, index) => {
          // We want to KEEP if there is talking (volume > 15) OR action (motion > 100)
          const isActive = f.volume > 15 || f.motion > 100;
          
          if (isActive) {
            if (!isKeeping) {
              // Start a new keep segment
              isKeeping = true;
              // Backtrack a little to catch the breath before they speak
              keepStart = Math.max(0, f.time - 0.5); 
            }
            silenceCounter = 0; // Reset silence timer
          } else {
            if (isKeeping) {
              silenceCounter++;
              // If it's been quiet for more than 1.5 seconds (15 frames at 10fps), stop keeping
              if (silenceCounter > 15) {
                isKeeping = false;
                let keepEnd = f.time - 1.5; // Cut the trailing silence
                if (keepEnd > keepStart + 0.5) { // Only add if longer than 0.5s
                  segments.push({ start: keepStart, end: keepEnd });
                }
              }
            }
          }
        });
        
        // Add final segment if we ended on a keep
        if (isKeeping) {
          segments.push({ start: keepStart, end: video.duration });
        }

        setTimelineData(segments);
        setActiveTab('editor'); return;
      }

      analyser.getByteFrequencyData(dataArray);
      let sum = 0; for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
      const avgVolume = sum / dataArray.length;

      mCtx.drawImage(video, 0, 0, 64, 64);
      const currentFrameData = mCtx.getImageData(0, 0, 64, 64).data;
      let motionScore = 0;
      if (prevFrameData) {
        for (let i = 0; i < currentFrameData.length; i += 4) {
          if (Math.abs(currentFrameData[i] - prevFrameData[i]) > 50) motionScore++;
        }
      }
      prevFrameData = currentFrameData;

      // Store frame data (sample at 10fps)
      if (frames.length < video.currentTime * 10) {
        frames.push({ time: video.currentTime, volume: avgVolume, motion: motionScore });
      }

      setAnalyzeProgress((video.currentTime / video.duration) * 100);
      requestAnimationFrame(analyzeLoop);
    };
    analyzeLoop();
  };

  const renderVideo = async () => {
    setIsRendering(true); setRenderProgress(0); setRenderError(''); setRenderStatus('Loading...');
    
    try {
      const video = document.createElement('video');
      video.src = videoUrl; video.crossOrigin = 'anonymous'; video.playsInline = true;
      video.style.display = 'none'; document.body.appendChild(video);

      if (video.readyState < 1) await new Promise((r) => { video.onloadedmetadata = r; setTimeout(r, 2000); });

      setRenderStatus('Preparing Pro Canvas...');
      const canvas = document.getElementById('renderCanvas');
      const ctx = canvas.getContext('2d');
      
      if (ratio === '9:16') { canvas.width = 1080; canvas.height = 1920; }
      else { canvas.width = 1920; canvas.height = 1080; }

      await document.fonts.ready;

      setRenderStatus('Connecting Audio...');
      const audioCtx = audioCtxRef.current;
      const dest = audioCtx.createMediaStreamDestination();
      
      const gameSource = audioCtx.createMediaElementSource(video);
      gameSource.connect(dest); gameSource.connect(audioCtx.destination);

      let musicAudio = null, musicGain = null;
      if (musicUrl) {
        musicAudio = new Audio(musicUrl); musicAudio.loop = true;
        const musicSource = audioCtx.createMediaElementSource(musicAudio);
        musicGain = audioCtx.createGain(); musicGain.gain.value = musicVolume;
        musicSource.connect(musicGain); musicGain.connect(dest); musicGain.connect(audioCtx.destination);
      }

      const stream = canvas.captureStream(30);
      dest.stream.getAudioTracks().forEach(track => stream.addTrack(track));

      setRenderStatus('Starting...');
      let options = { mimeType: 'video/webm;codecs=vp9,opus' };
      if (!MediaRecorder.isTypeSupported(options.mimeType)) options = { mimeType: 'video/webm' };

      const recorder = new MediaRecorder(stream, options);
      chunksRef.current = [];

      recorder.ondataavailable = (e) => { if (e.data.size > 0) chunksRef.current.push(e.data); };
      recorder.onstop = () => {
        if (musicAudio) musicAudio.pause(); document.body.removeChild(video);
        const blob = new Blob(chunksRef.current, { type: options.mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = `VR_ProEdit.webm`; a.click();
        setIsRendering(false); setRenderProgress(100); setRenderStatus('Done!');
      };

      video.currentTime = timelineData.length > 0 ? timelineData[0].start : 0;
      video.play().catch(e => console.log(e));
      if (musicAudio) musicAudio.play();
      await new Promise(r => setTimeout(r, 500));
      
      recorder.start(); setRenderStatus('Rendering PRO Edit...');

      let currentSegIndex = 0;
      let isSeeking = false;
      
      let currentZoom = 1.0, targetZoom = 1.0;
      let cameraDrift = 0;
      let flashAlpha = 0;
      let shakeX = 0, shakeY = 0, shakeRot = 0;
      let textScale = 0.5, textOpacity = 0;
      let lastSFXTime = -10;
      
      const analyser = audioCtx.createAnalyser(); gameSource.connect(analyser);
      const dataArray = new Uint8Array(analyser.frequencyBinCount);

      const renderLoop = () => {
        if (video.paused || video.ended || isSeeking) return;
        
        // If we have timeline data, enforce the cuts
        if (timelineData.length > 0) {
           const currentSeg = timelineData[currentSegIndex];
           
           // If we reached the end of the current keep segment, jump to the next!
           if (video.currentTime >= currentSeg.end) {
              currentSegIndex++;
              if (currentSegIndex < timelineData.length) {
                 isSeeking = true;
                 if (flashCuts) flashAlpha = 0.8; // Flash on cut
                 
                 // Seek to the next keep segment
                 video.currentTime = timelineData[currentSegIndex].start;
                 
                 // Wait for seek to complete before resuming loop
                 video.onseeked = () => { isSeeking = false; requestAnimationFrame(renderLoop); };
                 return;
              } else {
                 recorder.stop(); // We finished all keep segments
                 return;
              }
           }
        } else if (video.ended) {
            recorder.stop();
            return;
        }

        const time = video.currentTime;
        
        // Ducking
        if (audioDucking && musicGain) {
          analyser.getByteFrequencyData(dataArray);
          let sum = 0; for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
          musicGain.gain.setTargetAtTime((sum / dataArray.length) > 45 ? 0.05 : musicVolume, audioCtx.currentTime, 0.3);
        }

        // Pro Camera Motion
        if (proCamera) cameraDrift = Math.sin(time * 0.5) * 15;
        
        // Decay Shake
        if (shakeX > 0) shakeX *= 0.8;
        if (shakeY > 0) shakeY *= 0.8;
        if (shakeRot > 0) shakeRot *= 0.8;

        // --- DRAWING ---
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        if (colorGrade) ctx.filter = 'contrast(1.1) saturate(1.2)';

        // Blurred Background (For Shorts)
        if (ratio === '9:16' && blurBg) {
          ctx.save();
          ctx.filter = 'blur(30px) brightness(0.4)';
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          ctx.restore();
        }

        // Main Video
        ctx.save();
        ctx.translate(canvas.width / 2 + cameraDrift + (Math.random() - 0.5) * shakeX, canvas.height / 2 + (Math.random() - 0.5) * shakeY);
        ctx.rotate((Math.random() - 0.5) * shakeRot);
        ctx.scale(currentZoom, currentZoom);
        
        const videoRatio = video.videoWidth / video.videoHeight;
        const canvasRatio = canvas.width / canvas.height;
        let drawWidth = canvas.width, drawHeight = canvas.height;
        if (videoRatio > canvasRatio) drawHeight = canvas.width / videoRatio;
        else drawWidth = canvas.height * videoRatio;
        
        ctx.drawImage(video, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
        ctx.restore();

        // Text & SFX (Triggered on cuts or loud moments)
        if (flashAlpha > 0) {
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.filter = 'none';
          ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          flashAlpha -= 0.15;
        }

        // Progress (Calculate based on segments, not raw time)
        let totalKeepTime = timelineData.reduce((acc, seg) => acc + (seg.end - seg.start), 0);
        let currentKeepTime = timelineData.slice(0, currentSegIndex).reduce((acc, seg) => acc + (seg.end - seg.start), 0) + (time - timelineData[currentSegIndex].start);
        setRenderProgress((currentKeepTime / totalKeepTime) * 100);

        requestAnimationFrame(renderLoop);
      };
      renderLoop();
      
    } catch (error) {
      console.error(error); setRenderError("Render Error: " + error.message); setIsRendering(false);
    }
  };

  return (
    <div className="min-h-screen pb-24">
      <header className="sticky top-0 z-50 glass px-6 py-4 flex justify-between items-center">
        <h1 className="text-xl font-extrabold tracking-tight">VR Editor <span className="neon-text">AI</span></h1>
        <div className="text-xs font-bold px-3 py-1 rounded-full bg-yellow-500/10 text-yellow-400 border border-yellow-500/20">● PRO 3.0</div>
      </header>

      <main className="max-w-3xl mx-auto p-4 space-y-6">
        
        {activeTab === 'dashboard' && (
          <div className="glass p-8 rounded-3xl text-center space-y-6">
            <h2 className="text-3xl font-extrabold tracking-tight">True Auto-Cutter</h2>
            <p className="text-gray-400 text-sm">Cuts out ALL dead space, silence, and loading screens automatically.</p>
            <label className="neon-btn cursor-pointer block w-full py-4 rounded-xl font-bold text-lg">
              <span>Import Video</span>
              <input type="file" accept="video/*" className="hidden" onChange={handleFileUpload} />
            </label>
          </div>
        )}

        {activeTab === 'analyze' && (
          <div className="glass p-6 rounded-3xl space-y-4">
            <h2 className="text-xl font-bold">AI Analysis</h2>
            <div className="h-32 bg-black/50 rounded-xl flex items-center justify-center border border-gray-800">
              <video ref={videoRef} src={videoUrl} onLoadedMetadata={(e) => setVideoDuration(e.target.duration)} className="hidden" playsInline crossOrigin="anonymous" />
              <div className="text-center">
                <p className="text-sm font-mono text-purple-400 mb-2">{Math.floor(analyzeProgress)}% Analyzed</p>
                <div className="w-48 h-2 bg-gray-800 rounded-full mx-auto overflow-hidden">
                  <div className="h-full bg-purple-500 transition-all" style={{ width: `${analyzeProgress}%` }}></div>
                </div>
              </div>
            </div>
            {!isAnalyzing && timelineData.length === 0 && (
              <button onClick={startAnalysis} className="neon-btn w-full py-4 rounded-xl font-bold">Start Analysis</button>
            )}
          </div>
        )}

        {activeTab === 'editor' && (
          <div className="space-y-4">
            <div className="glass p-5 rounded-3xl">
              <h3 className="font-bold text-sm uppercase text-gray-400 mb-2">Timeline (EDL)</h3>
              <canvas id="timelineCanvas" className="w-full h-[100px] rounded-lg" />
              <p className="text-xs text-gray-500 mt-2">Purple = Keep. Grey = Cut (Silence/Loading).</p>
            </div>

            <div className="glass p-5 rounded-3xl space-y-2">
              <h3 className="font-bold text-sm uppercase text-gray-400 mb-2">Visuals & FX</h3>
              <label className="flex items-center justify-between p-2 border-b border-gray-800 text-sm font-semibold cursor-pointer">
                Blurred Background <input type="checkbox" checked={blurBg} onChange={(e) => setBlurBg(e.target.checked)} className="accent-purple-500 w-5 h-5" />
              </label>
              <label className="flex items-center justify-between p-2 border-b border-gray-800 text-sm font-semibold cursor-pointer">
                Flash Cuts <input type="checkbox" checked={flashCuts} onChange={(e) => setFlashCuts(e.target.checked)} className="accent-purple-500 w-5 h-5" />
              </label>
              <label className="flex items-center justify-between p-2 text-sm font-semibold cursor-pointer">
                Pro Camera Motion <input type="checkbox" checked={proCamera} onChange={(e) => setProCamera(e.target.checked)} className="accent-purple-500 w-5 h-5" />
              </label>
            </div>

            <div className="glass p-5 rounded-3xl space-y-4">
              <h3 className="font-bold text-sm uppercase text-gray-400">Custom Assets</h3>
              <div className="flex gap-2">
                <label className="flex-1 cursor-pointer bg-gray-900 border border-gray-800 rounded-xl p-3 text-center text-sm font-bold text-gray-300">
                  <span>Font (.ttf)</span><input type="file" accept=".ttf,.otf" className="hidden" onChange={handleFontUpload} />
                </label>
                <label className="flex-1 cursor-pointer bg-gray-900 border border-gray-800 rounded-xl p-3 text-center text-sm font-bold text-gray-300">
                  <span>Music</span><input type="file" accept="audio/*" className="hidden" onChange={(e) => setMusicUrl(URL.createObjectURL(e.target.files[0]))} />
                </label>
              </div>
            </div>

            <button onClick={() => setActiveTab('export')} className="neon-btn w-full py-4 rounded-xl font-bold">Continue to Export</button>
          </div>
        )}

        {activeTab === 'export' && (
          <div className="glass p-8 rounded-3xl text-center space-y-6">
            <h2 className="text-2xl font-bold">Render Studio</h2>
            {renderError && <div className="bg-red-500/20 border border-red-500/50 text-red-200 p-4 rounded-xl text-sm text-left">{renderError}</div>}
            {isRendering ? (
              <div className="space-y-2">
                <div className="h-2 w-full bg-gray-800 rounded-full overflow-hidden">
                  <div className="h-full bg-blue-500 transition-all" style={{ width: `${renderProgress}%` }}></div>
                </div>
                <p className="text-xs text-blue-400 font-mono">Rendering... {Math.floor(renderProgress)}%</p>
                <p className="text-xs text-yellow-400 font-bold mt-2">{renderStatus}</p>
              </div>
            ) : (
              <button onClick={renderVideo} className="neon-btn w-full py-4 rounded-xl font-bold">Render PRO Video</button>
            )}
          </div>
        )}

      </main>

      <nav className="fixed bottom-0 left-0 right-0 glass flex justify-around py-4 z-50">
        {['dashboard', 'analyze', 'editor', 'export'].map(tab => (
          <button key={tab} onClick={() => setActiveTab(tab)} className={`flex flex-col items-center gap-1 text-[10px] font-bold uppercase tracking-wider ${activeTab === tab ? 'text-purple-400' : 'text-gray-600'}`}>
            <div className={`w-8 h-8 rounded-xl flex items-center justify-center ${activeTab === tab ? 'bg-purple-500/20' : ''}`}>{tab[0].toUpperCase()}</div>
            <span>{tab}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
